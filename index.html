<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Cyber Snake</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap');

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #080914;
            color: #f0f6fc;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* Modern Glassmorphism Panel Styling */
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Compact Canvas Container */
        .canvas-container {
            position: relative;
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.25), inset 0 0 15px rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(6, 182, 212, 0.5);
            border-radius: 12px;
            overflow: hidden;
            width: 100%;
            max-width: 380px; /* Compact height/width footprint */
            aspect-ratio: 1 / 1;
        }

        /* Arcade Buttons */
        .arcade-btn {
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            box-shadow: 0 4px 14px rgba(14, 165, 233, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            transition: all 0.15s ease;
        }

        .arcade-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(14, 165, 233, 0.6);
        }

        .arcade-btn:active {
            transform: translateY(1px);
            box-shadow: 0 2px 8px rgba(14, 165, 233, 0.4);
        }

        .secondary-btn {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            transition: all 0.15s ease;
        }

        .secondary-btn:hover {
            background: rgba(51, 65, 85, 0.9);
            border-color: rgba(56, 189, 248, 0.6);
        }

        /* Touch Controls Styling */
        .d-pad-btn {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(6, 182, 212, 0.5);
            color: #38bdf8;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            transition: all 0.1s ease;
        }

        .d-pad-btn:active {
            background: rgba(6, 182, 212, 0.4);
            transform: scale(0.92);
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.6);
        }

        /* Scanline Overlay */
        .scanlines {
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.03),
                rgba(0, 255, 0, 0.01),
                rgba(0, 0, 255, 0.03)
            );
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        .text-glow-cyan {
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.8);
        }

        .text-glow-pink {
            text-shadow: 0 0 10px rgba(236, 72, 153, 0.8);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-2 bg-slate-950 overflow-x-hidden">

    <!-- Compact Game Container Card -->
    <main class="w-full max-w-sm glass-panel rounded-2xl p-3 sm:p-4 flex flex-col items-center gap-2.5 shadow-2xl">
        
        <!-- Header & Title -->
        <header class="w-full text-center">
            <h1 class="text-2xl font-black font-orbitron tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-teal-300 to-pink-500 text-glow-cyan">
                CYBER SNAKE
            </h1>
            <p class="text-[11px] font-semibold tracking-widest text-cyan-300 uppercase mt-0.5">
                Developer: Nitish Kumar Yadav
            </p>
        </header>

        <!-- Scoreboard Header -->
        <div class="w-full bg-slate-900/80 rounded-xl p-2 flex justify-between items-center text-center border border-slate-800">
            <div>
                <div class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider">Score</div>
                <div id="score" class="text-xl font-bold font-orbitron text-cyan-400 text-glow-cyan">0</div>
            </div>

            <!-- Bonus Food Timer Indicator -->
            <div id="bonus-container" class="opacity-0 transition-opacity duration-300 flex flex-col items-center">
                <div class="text-[10px] text-pink-400 font-semibold uppercase tracking-wider animate-pulse">Bonus Active</div>
                <div class="w-16 bg-slate-800 rounded-full h-1.5 mt-0.5 overflow-hidden border border-pink-500/50">
                    <div id="bonus-timer-bar" class="bg-gradient-to-r from-pink-500 to-purple-500 h-full w-full transition-all duration-100"></div>
                </div>
            </div>

            <div>
                <div class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider">High Score</div>
                <div id="high-score" class="text-xl font-bold font-orbitron text-purple-400">0</div>
            </div>
        </div>

        <!-- Shorter/Compact Canvas Game Board -->
        <div class="canvas-container flex justify-center items-center bg-slate-900/90 relative">
            <canvas id="gameCanvas" class="w-full h-full block"></canvas>
            
            <!-- Scanline Aesthetic Layer -->
            <div class="scanlines absolute inset-0"></div>

            <!-- Start / Pause / Game Over Overlay -->
            <div id="game-overlay" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center p-4 text-center transition-all duration-300 z-10">
                <div id="overlay-content" class="flex flex-col items-center w-full">
                    <h2 id="overlay-title" class="text-2xl font-extrabold font-orbitron text-cyan-400 text-glow-cyan mb-1">
                        READY PLAYER ONE
                    </h2>
                    <p id="overlay-subtitle" class="text-slate-300 text-xs mb-4">
                        Press Start to Begin
                    </p>

                    <!-- Speed/Difficulty Selection -->
                    <div class="mb-4 w-full max-w-[200px]">
                        <label for="speed-select" class="block text-[11px] text-cyan-300 font-bold uppercase tracking-wider mb-1">
                            Snake Speed
                        </label>
                        <select id="speed-select" class="w-full bg-slate-800 text-cyan-300 border border-cyan-500/50 rounded-lg px-2 py-1.5 text-center font-orbitron text-xs focus:outline-none focus:ring-2 focus:ring-cyan-400">
                            <option value="250" selected>Relaxed (Very Slow)</option>
                            <option value="200">Easy (Slow)</option>
                            <option value="160">Normal (Moderate)</option>
                            <option value="120">Hard (Fast)</option>
                        </select>
                    </div>

                    <!-- Prominent Start Button -->
                    <button id="start-btn" class="arcade-btn w-full max-w-[200px] py-2.5 text-slate-950 font-black font-orbitron text-base rounded-xl">
                        START GAME
                    </button>
                </div>
            </div>
        </div>

        <!-- Sleek Control Bar Buttons -->
        <div class="w-full flex justify-between gap-2">
            <button id="pause-btn" class="secondary-btn flex-1 py-2 rounded-xl text-cyan-300 font-orbitron font-semibold text-xs flex items-center justify-center gap-1.5">
                <svg id="pause-icon" class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                <span id="pause-text">PAUSE</span>
            </button>
            <button id="restart-btn" class="secondary-btn flex-1 py-2 rounded-xl text-cyan-300 font-orbitron font-semibold text-xs flex items-center justify-center gap-1.5">
                <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
                <span>RESTART</span>
            </button>
            <button id="sound-btn" class="secondary-btn flex-1 py-2 rounded-xl text-cyan-300 font-orbitron font-semibold text-xs flex items-center justify-center gap-1.5">
                <svg id="sound-icon" class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                <span id="sound-text">SOUND</span>
            </button>
        </div>

        <!-- Compact D-Pad Controls for Mobile/Touch -->
        <div class="w-full max-w-[210px] grid grid-cols-3 gap-1.5 my-1">
            <div></div>
            <button id="btn-up" class="d-pad-btn h-11 rounded-lg flex items-center justify-center font-bold text-lg">
                ▲
            </button>
            <div></div>
            <button id="btn-left" class="d-pad-btn h-11 rounded-lg flex items-center justify-center font-bold text-lg">
                ◄
            </button>
            <button id="btn-down" class="d-pad-btn h-11 rounded-lg flex items-center justify-center font-bold text-lg">
                ▼
            </button>
            <button id="btn-right" class="d-pad-btn h-11 rounded-lg flex items-center justify-center font-bold text-lg">
                ►
            </button>
        </div>

    </main>

    <!-- Game Logic Script -->
    <script>
        // --- Web Audio API Synth Sound Effects ---
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            playTone(freq, type, duration, volume = 0.1) {
                if (this.muted || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.00001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) { console.warn("Audio play error", e); }
            }

            playEatNormal() {
                this.playTone(523.25, 'sine', 0.12, 0.15); // C5
                setTimeout(() => this.playTone(659.25, 'sine', 0.12, 0.15), 60); // E5
            }

            playEatBonus() {
                this.playTone(587.33, 'triangle', 0.1, 0.2);
                setTimeout(() => this.playTone(783.99, 'triangle', 0.1, 0.2), 60);
                setTimeout(() => this.playTone(1046.50, 'triangle', 0.2, 0.2), 120);
            }

            playGameOver() {
                if (this.muted || !this.ctx) return;
                this.playTone(300, 'sawtooth', 0.15, 0.2);
                setTimeout(() => this.playTone(200, 'sawtooth', 0.15, 0.2), 120);
                setTimeout(() => this.playTone(100, 'sawtooth', 0.3, 0.25), 240);
            }

            playMove() {
                this.playTone(120, 'sine', 0.04, 0.03);
            }
        }

        const sound = new SoundEngine();

        // --- Game Setup and Canvas ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI Element References
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('high-score');
        const overlay = document.getElementById('game-overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlaySubtitle = document.getElementById('overlay-subtitle');
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const restartBtn = document.getElementById('restart-btn');
        const pauseText = document.getElementById('pause-text');
        const soundBtn = document.getElementById('sound-btn');
        const soundText = document.getElementById('sound-text');
        const speedSelect = document.getElementById('speed-select');
        const bonusContainer = document.getElementById('bonus-container');
        const bonusTimerBar = document.getElementById('bonus-timer-bar');

        // Grid Configuration
        const GRID_SIZE = 18; // Compact 18x18 grid
        let cellSize = 0;

        // Game State Variables
        let snake = [];
        let direction = { x: 0, y: 0 };
        let nextDirection = { x: 0, y: 0 };
        let food = { x: 0, y: 0 };
        let bonusFood = null;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('cyber_snake_high_score')) || 0;
        let gameSpeed = 250; // Much slower tick delay in ms
        let baseSpeed = 250;
        let isRunning = false;
        let isPaused = false;
        let gameLoopTimeout = null;
        let normalFoodEatenCount = 0; // Track consecutive normal foods eaten

        // Synchronize Canvas Pixel Dimensions
        function resizeCanvas() {
            const container = canvas.parentElement;
            const size = Math.min(container.clientWidth, container.clientHeight);
            canvas.width = size;
            canvas.height = size;
            cellSize = size / GRID_SIZE;
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
            draw();
        });

        // Initialize Display
        resizeCanvas();
        highScoreEl.innerText = highScore;

        // --- Game Logic Functions ---

        function initGame() {
            const startX = Math.floor(GRID_SIZE / 2);
            const startY = Math.floor(GRID_SIZE / 2);
            snake = [
                { x: startX, y: startY },
                { x: startX - 1, y: startY },
                { x: startX - 2, y: startY }
            ];

            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            baseSpeed = parseInt(speedSelect.value);
            gameSpeed = baseSpeed;
            bonusFood = null;
            normalFoodEatenCount = 0;

            updateScoreUI();
            hideBonusUI();
            spawnFood();

            isRunning = true;
            isPaused = false;
            overlay.classList.add('hidden');
            pauseText.innerText = 'PAUSE';

            if (gameLoopTimeout) clearTimeout(gameLoopTimeout);
            gameLoop();
        }

        function spawnFood() {
            let valid = false;
            while (!valid) {
                food.x = Math.floor(Math.random() * GRID_SIZE);
                food.y = Math.floor(Math.random() * GRID_SIZE);
                valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
            }
        }

        function spawnBonusFood() {
            let valid = false;
            let bx, by;
            while (!valid) {
                bx = Math.floor(Math.random() * GRID_SIZE);
                by = Math.floor(Math.random() * GRID_SIZE);
                const onSnake = snake.some(s => s.x === bx && s.y === by);
                const onFood = food.x === bx && food.y === by;
                valid = !onSnake && !onFood;
            }
            bonusFood = { x: bx, y: by, duration: 50, maxDuration: 50 };
            showBonusUI();
        }

        function updateScoreUI() {
            scoreEl.innerText = score;
            if (score > highScore) {
                highScore = score;
                highScoreEl.innerText = highScore;
                localStorage.setItem('cyber_snake_high_score', highScore);
            }
        }

        function showBonusUI() {
            bonusContainer.classList.remove('opacity-0');
        }

        function hideBonusUI() {
            bonusContainer.classList.add('opacity-0');
            bonusFood = null;
        }

        function update() {
            direction = { ...nextDirection };

            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

            // Collision Detection: Walls
            if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                return gameOver();
            }

            // Collision Detection: Self
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                return gameOver();
            }

            // Move Snake
            snake.unshift(head);

            // Check Collision: Regular Food (5 points each)
            if (head.x === food.x && head.y === food.y) {
                score += 5;
                normalFoodEatenCount++;
                sound.playEatNormal();
                spawnFood();
                updateScoreUI();

                // Gentle speed scaling
                if (gameSpeed > 100) {
                    gameSpeed = Math.max(100, baseSpeed - Math.floor(score / 50) * 5);
                }

                // After eating 5 normal foods continuously, spawn a BIG bonus food
                if (normalFoodEatenCount >= 5 && !bonusFood) {
                    spawnBonusFood();
                    normalFoodEatenCount = 0; // Reset counter for next cycle
                }
            } 
            // Check Collision: Big Bonus Food (25 points)
            else if (bonusFood && head.x === bonusFood.x && head.y === bonusFood.y) {
                score += 25; // High reward for Big Food
                sound.playEatBonus();
                hideBonusUI();
                updateScoreUI();
            } 
            else {
                snake.pop();
            }

            // Update Bonus Timer
            if (bonusFood) {
                bonusFood.duration--;
                const pct = (bonusFood.duration / bonusFood.maxDuration) * 100;
                bonusTimerBar.style.width = `${pct}%`;

                if (bonusFood.duration <= 0) {
                    hideBonusUI();
                }
            }
        }

        // --- Canvas Rendering ---

        function draw() {
            ctx.fillStyle = '#080914';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grid Lines
            ctx.strokeStyle = 'rgba(30, 41, 59, 0.4)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * cellSize, 0);
                ctx.lineTo(i * cellSize, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * cellSize);
                ctx.lineTo(canvas.width, i * cellSize);
                ctx.stroke();
            }

            // Regular Food
            const foodCenterX = food.x * cellSize + cellSize / 2;
            const foodCenterY = food.y * cellSize + cellSize / 2;
            const radius = (cellSize / 2) * 0.75;

            ctx.shadowBlur = 12;
            ctx.shadowColor = '#06b6d4';
            ctx.fillStyle = '#22d3ee';
            ctx.beginPath();
            ctx.arc(foodCenterX, foodCenterY, radius, 0, Math.PI * 2);
            ctx.fill();

            // Big Bonus Food (Visibly larger with pulsing glow)
            if (bonusFood) {
                const bx = bonusFood.x * cellSize;
                const by = bonusFood.y * cellSize;

                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ec4899';
                ctx.fillStyle = '#f43f5e';
                ctx.beginPath();
                ctx.roundRect(bx + 1, by + 1, cellSize - 2, cellSize - 2, 6);
                ctx.fill();

                // Inner glowing core for the big food
                ctx.fillStyle = '#ffd700';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ffd700';
                ctx.beginPath();
                ctx.arc(bx + cellSize / 2, by + cellSize / 2, cellSize * 0.28, 0, Math.PI * 2);
                ctx.fill();
            }

            // Snake Rendering
            snake.forEach((segment, index) => {
                const sx = segment.x * cellSize;
                const sy = segment.y * cellSize;
                const padding = 1.5;

                if (index === 0) {
                    // Head
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#06b6d4';
                    ctx.fillStyle = '#38bdf8';
                    ctx.beginPath();
                    ctx.roundRect(sx + padding, sy + padding, cellSize - padding * 2, cellSize - padding * 2, 5);
                    ctx.fill();

                    // Eyes
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#090d16';
                    const eyeSize = cellSize * 0.18;
                    
                    let eyeX1 = sx + cellSize * 0.25, eyeY1 = sy + cellSize * 0.25;
                    let eyeX2 = sx + cellSize * 0.75, eyeY2 = sy + cellSize * 0.25;

                    if (direction.x === 1) {
                        eyeX1 = eyeX2 = sx + cellSize * 0.7;
                        eyeY1 = sy + cellSize * 0.25;
                        eyeY2 = sy + cellSize * 0.75;
                    } else if (direction.x === -1) {
                        eyeX1 = eyeX2 = sx + cellSize * 0.3;
                        eyeY1 = sy + cellSize * 0.25;
                        eyeY2 = sy + cellSize * 0.75;
                    } else if (direction.y === 1) {
                        eyeY1 = eyeY2 = sy + cellSize * 0.7;
                        eyeX1 = sx + cellSize * 0.25;
                        eyeX2 = sx + cellSize * 0.75;
                    }

                    ctx.beginPath();
                    ctx.arc(eyeX1, eyeY1, eyeSize, 0, Math.PI * 2);
                    ctx.arc(eyeX2, eyeY2, eyeSize, 0, Math.PI * 2);
                    ctx.fill();

                } else {
                    // Body
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = 'rgba(16, 185, 129, 0.4)';
                    const alpha = Math.max(0.35, 1 - (index / snake.length) * 0.55);
                    ctx.fillStyle = `rgba(16, 185, 129, ${alpha})`;
                    
                    ctx.beginPath();
                    ctx.roundRect(sx + padding, sy + padding, cellSize - padding * 2, cellSize - padding * 2, 3);
                    ctx.fill();
                }
            });

            ctx.shadowBlur = 0;
        }

        function gameLoop() {
            if (!isRunning) return;

            if (!isPaused) {
                update();
                draw();
            }

            gameLoopTimeout = setTimeout(gameLoop, gameSpeed);
        }

        function gameOver() {
            isRunning = false;
            sound.playGameOver();

            overlayTitle.innerText = "GAME OVER";
            overlayTitle.className = "text-2xl font-extrabold font-orbitron text-pink-500 text-glow-pink mb-1";
            overlaySubtitle.innerText = `Final Score: ${score}`;
            startBtn.innerText = "PLAY AGAIN";
            overlay.classList.remove('hidden');
        }

        function togglePause() {
            if (!isRunning) return;
            isPaused = !isPaused;
            if (isPaused) {
                pauseText.innerText = "RESUME";
                overlayTitle.innerText = "GAME PAUSED";
                overlayTitle.className = "text-2xl font-extrabold font-orbitron text-amber-400 text-glow-cyan mb-1";
                overlaySubtitle.innerText = "Take a breather!";
                startBtn.innerText = "CONTINUE";
                overlay.classList.remove('hidden');
            } else {
                pauseText.innerText = "PAUSE";
                overlay.classList.add('hidden');
            }
        }

        // --- Controls & Inputs ---

        function handleDirectionChange(newDir) {
            if (newDir.x !== 0 && direction.x === -newDir.x) return;
            if (newDir.y !== 0 && direction.y === -newDir.y) return;

            if (nextDirection.x !== newDir.x || nextDirection.y !== newDir.y) {
                sound.playMove();
            }
            nextDirection = newDir;
        }

        // Keyboard Navigation
        window.addEventListener('keydown', (e) => {
            sound.init();
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    e.preventDefault();
                    handleDirectionChange({ x: 0, y: -1 });
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    e.preventDefault();
                    handleDirectionChange({ x: 0, y: 1 });
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    e.preventDefault();
                    handleDirectionChange({ x: -1, y: 0 });
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    e.preventDefault();
                    handleDirectionChange({ x: 1, y: 0 });
                    break;
                case ' ':
                    e.preventDefault();
                    if (!isRunning) {
                        initGame();
                    } else {
                        togglePause();
                    }
                    break;
            }
        });

        // Touch Control Bindings
        const bindButton = (id, dir) => {
            const btn = document.getElementById(id);
            const trigger = (e) => {
                e.preventDefault();
                sound.init();
                if (isRunning && !isPaused) {
                    handleDirectionChange(dir);
                }
            };
            btn.addEventListener('touchstart', trigger, { passive: false });
            btn.addEventListener('click', trigger);
        };

        bindButton('btn-up', { x: 0, y: -1 });
        bindButton('btn-down', { x: 0, y: 1 });
        bindButton('btn-left', { x: -1, y: 0 });
        bindButton('btn-right', { x: 1, y: 0 });

        // Touch Swipe
        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
            sound.init();
        }, { passive: true });

        canvas.addEventListener('touchend', (e) => {
            if (!isRunning || isPaused) return;
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;

            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;

            if (Math.max(Math.abs(dx), Math.abs(dy)) > 20) {
                if (Math.abs(dx) > Math.abs(dy)) {
                    handleDirectionChange(dx > 0 ? { x: 1, y: 0 } : { x: -1, y: 0 });
                } else {
                    handleDirectionChange(dy > 0 ? { x: 0, y: 1 } : { x: 0, y: -1 });
                }
            }
        }, { passive: true });

        // Action Button Listeners
        startBtn.addEventListener('click', () => {
            sound.init();
            if (isPaused) {
                togglePause();
            } else {
                initGame();
            }
        });

        pauseBtn.addEventListener('click', () => {
            sound.init();
            togglePause();
        });

        restartBtn.addEventListener('click', () => {
            sound.init();
            initGame();
        });

        soundBtn.addEventListener('click', () => {
            sound.init();
            sound.muted = !sound.muted;
            soundText.innerText = sound.muted ? 'MUTED' : 'SOUND';
            soundBtn.classList.toggle('opacity-50', sound.muted);
        });

        draw();
    </script>
</body>
</html>
